th="300" height="145" rx="3"></rect><foreignObject x="40" y="1275" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Post-run perturbation checks</xhtml:strong><xhtml:div>h/c ±0.01 or C-rate ±0.1</xhtml:div><xhtml:div>Keep selected tier; withhold from search</xhtml:div></xhtml:div></foreignObject></g><g data-node="checks" data-kind="artifact"><ellipse class="artifact" cx="190" cy="1550" rx="150" ry="55"></ellipse><foreignObject x="40" y="1495" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>summary + holdout</xhtml:strong><xhtml:div>Perturbation metric / old robust</xhtml:div><xhtml:div>Old robust only requires scoreability</xhtml:div></xhtml:div></foreignObject></g><g data-node="recheck" data-kind="module"><rect class="module human" x="450" y="1475" width="300" height="145" rx="3"></rect><foreignObject x="450" y="1475" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Post-hoc uniform recheck</xhtml:strong><xhtml:div>All battery endpoints at tier 2</xhtml:div><xhtml:div>History discovery vs endpoint feasibility</xhtml:div></xhtml:div></foreignObject></g><g data-node="report" data-kind="artifact"><ellipse class="artifact" cx="1010" cy="1550" rx="150" ry="55"></ellipse><foreignObject x="860" y="1495" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>Report / comparison plots</xhtml:strong><xhtml:div>12 discovered; 6 selected feasibility</xhtml:div><xhtml:div>No automatic reselection here</xhtml:div></xhtml:div></foreignObject></g><g data-node="dep1" data-kind="module"><rect class="module external" x="40" y="1730" width="300" height="100" rx="3"></rect><foreignObject x="40" y="1730" width="300" height="100"><xhtml:div class="node-text "><xhtml:strong>D1 · AIDE</xhtml:strong><xhtml:div>Agent / Interpreter / Journal</xhtml:div></xhtml:div></foreignObject></g><g data-node="dep2" data-kind="module"><rect class="module external" x="450" y="1730" width="300" height="100" 