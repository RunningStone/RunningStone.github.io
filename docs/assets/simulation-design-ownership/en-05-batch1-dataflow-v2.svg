<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" viewBox="0 0 1240 2000" role="img" aria-labelledby="batch1-title batch1-desc"><title id="batch1-title">Historical Batch 1 implementation: modules, artifacts, and data flow</title><desc id="batch1-desc">Rectangles are modules, ellipses are artifacts, and arrows carry data from producers through artifacts to consumers. Human task definition and priors feed the controller, DesignAgent, fixed executor, and simulation blocks. Numerical scoring feeds recorded history, selection, independent checks, and post-run review. External dependencies D1–D6 are outside the project boundary.</desc><style>.module{fill:#f3f5f4;stroke:#bccbca;stroke-width:1.4}.module.agent{fill:#fff5f2;stroke:#b4473e;stroke-width:2.8}.module.external{fill:#edf5fc;stroke:#4282b3;stroke-width:1.8}.module.human{fill:#faf3e7;stroke:#ccb78e}.module.issue{fill:#fff0e8;stroke:#cc947e}.artifact{fill:#eef7f2;stroke:#6d9c8a;stroke-width:1.4}.edge{fill:none;stroke:#48636c;stroke-width:1.6;marker-end:url(#batch1-arrow)}.bypass{stroke-dasharray:6 4}.node-text{box-sizing:border-box;height:100%;display:flex;flex-direction:column;justify-content:center;gap:7px;text-align:center;font:15px/1.45 'PingFang SC','Microsoft YaHei',sans-serif;color:#163549;padding:10px 16px}.node-text strong{font-size:18px;font-weight:600}.node-text small{font-size:12px;color:#52666b;line-height:1.35}.node-text .dependency-ref{color:#245e8d;background:#e6f1fa;border:1px solid #b3cfe3;padding:3px 5px;font-size:11px}.artifact-text{padding:12px 27px;font-size:14px}.artifact-text strong{font-size:16px}.note{font:13px 'PingFang SC',sans-serif;fill:#52666b}.group-boundary{fill:none;stroke:#819592;stroke-width:1.6;stroke-dasharray:9 6}.group-title{font:600 17px 'PingFang SC',sans-serif;fill:#173447}.source{font-family:monospace;font-size:12px}.cv-text{font-size:12px;line-height:1.2}.cv-text strong{font-size:13px}.node-text{font-size:14px;line-height:1.35;gap:5px}.node-text strong{font-size:16px}.artifact-text{font-size:13px}.cv-group-title{font-size:15px}.cv-heading{font-size:16px}</style><defs><marker id="batch1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#48636c"></path></marker></defs>
