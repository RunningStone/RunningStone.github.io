html:strong><xhtml:div>Parameters / OPTIONS / settings</xhtml:div><xhtml:div>Input hash → cache lookup</xhtml:div></xhtml:div></foreignObject></g><g data-node="simblock" data-kind="module"><rect class="module " x="450" y="675" width="300" height="145" rx="3"></rect><foreignObject x="450" y="675" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>simblock: airfoil</xhtml:strong><xhtml:div>Geometry → mesh → solve → analysis</xhtml:div><xhtml:small class="dependency-ref">Dependency D4</xhtml:small></xhtml:div></foreignObject></g><g data-node="battblock" data-kind="module"><rect class="module " x="860" y="675" width="300" height="145" rx="3"></rect><foreignObject x="860" y="675" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>battblock: battery</xhtml:strong><xhtml:div>Tier 0 lumped; tier 2 fixed-point coupling</xhtml:div><xhtml:div>PyBaMM heat ↔ OpenFOAM temperature</xhtml:div><xhtml:small class="dependency-ref">Dependencies D4 / D5</xhtml:small></xhtml:div></foreignObject></g><g data-node="scoring" data-kind="module"><rect class="module " x="40" y="895" width="300" height="145" rx="3"></rect><foreignObject x="40" y="895" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Fixed gates / scoring</xhtml:strong><xhtml:div>Trust → accept observation or no score</xhtml:div><xhtml:div>Forces / objectives → J or Jᵦ</xhtml:div></xhtml:div></foreignObject></g><g data-node="raw" data-kind="artifact"><ellipse class="artifact" cx="600" cy="973" rx="150" ry="60"></ellipse><foreignObject x="450" y="913" width="300" height="120"><xhtml:div class="node-text artifact-text"><xhtml:strong>CaseResult + raw files</xhtml:strong><xhtml:div>Force / temperature / trust / failure</xhtml:div><xhtml:div>field_summary / provenance / fields</xhtml:div></xhtml:div></foreignObject></g><g data-node="eval" data-kind="artifact"><ellipse class="artifact" cx="190" cy="1150" rx="150" ry="55"></ellipse><foreignObject x="40" y="1095" width="300" height=