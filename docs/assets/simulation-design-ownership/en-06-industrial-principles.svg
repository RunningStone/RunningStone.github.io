<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" viewBox="0 0 1240 1290" role="img" aria-labelledby="industrial-title industrial-desc"><title id="industrial-title">Proposed industrial architecture: separate search, evidence, and eligibility</title><desc id="industrial-desc">Rectangles are modules, ellipses are artifacts, and arrows carry data from producers through artifacts to consumers. Accountable engineers approve contracts; model experts maintain the registry. The Agent plans experiments, durable execution calls isolated workers, immutable evidence feeds independent eligibility checks, and authorised approval produces a delivery package.</desc><style>.module{fill:#f3f5f4;stroke:#bccbca;stroke-width:1.4}.module.agent{fill:#fff5f2;stroke:#b4473e;stroke-width:2.8}.module.external{fill:#edf5fc;stroke:#4282b3;stroke-width:1.8}.module.human{fill:#faf3e7;stroke:#ccb78e}.module.issue{fill:#fff0e8;stroke:#cc947e}.artifact{fill:#eef7f2;stroke:#6d9c8a;stroke-width:1.4}.edge{fill:none;stroke:#48636c;stroke-width:1.6;marker-end:url(#industrial-arrow)}.bypass{stroke-dasharray:6 4}.node-text{box-sizing:border-box;height:100%;display:flex;flex-direction:column;justify-content:center;gap:7px;text-align:center;font:15px/1.45 'PingFang SC','Microsoft YaHei',sans-serif;color:#163549;padding:10px 16px}.node-text strong{font-size:18px;font-weight:600}.node-text small{font-size:12px;color:#52666b;line-height:1.35}.node-text .dependency-ref{color:#245e8d;background:#e6f1fa;border:1px solid #b3cfe3;padding:3px 5px;font-size:11px}.artifact-text{padding:12px 27px;font-size:14px}.artifact-text strong{font-size:16px}.note{font:13px 'PingFang SC',sans-serif;fill:#52666b}.group-boundary{fill:none;stroke:#819592;stroke-width:1.6;stroke-dasharray:9 6}.group-title{font:600 17px 'PingFang SC',sans-serif;fill:#173447}.source{font-family:monospace;font-size:12px}.cv-text{font-size:12px;line-height:1.2}.cv-text strong{font-size:13px}.node-text{font-size:14px;line-height:1.35;gap:5px}.node-text strong{font-size:16px}.artifact-text{font-size:13px}.cv-group-title{font-size:15px}.cv-heading{font-size:16px}</style><defs><marker id="industrial-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#48636c"></path></marker></defs>
  
  <path class="edge " data-from="approve" data-to="taskSpec" d="M340 112 H450"></path><path class="edge " data-from="taskSpec" data-to="planner" d="M750 112 H860"></path><path class="edge " data-from="modelOwner" data-to="registry" d="M340 317 H450"></path><path class="edge " data-from="registry" data-to="planner" d="M750 318 H805 V154 H860"></path><path class="edge " data-from="planner" data-to="plan" d="M1010 185 V263"></path><path class="edge " data-from="plan" data-to="runtime" d="M1010 373 V445"></path><path class="edge " data-from="runtime" data-to="call" d="M1010 590 V663"></path><path class="edge " data-from="call" data-to="worker" d="M860 718 H750"></path><path class="edge " data-from="worker" data-to="call" d="M600 790 V813 H1010 V773"></path><path class="edge " data-from="worker" data-to="evidence" d="M450 718 H340"></path><path class="edge " data-from="evidence" data-to="gate" d="M190 773 V910"></path><path class="edge " data-from="gate" data-to="verdict" d="M340 983 H450"></path><path class="edge " data-from="verdict" data-to="release" d="M750 983 H860"></path><path class="edge " data-from="release" data-to="delivery" d="M1010 1055 V1120"></path><path class="edge " data-from="taskSpec" data-to="gate" d="M600 168 V215 H18 V982 H40"></path><path class="edge " data-from="registry" data-to="worker" d="M600 373 V645"></path><path class="edge " data-from="registry" data-to="gate" d="M600 373 V600 H375 V875 H190 V910"></path><path class="edge " data-from="evidence" data-to="planner" d="M190 663 V410 H1210 V110 H1160"></path><path class="edge " data-from="call" data-to="planner" d="M1160 718 H1185 V155 H1160"></path><path class="edge " data-from="verdict" data-to="modelOwner" d="M600 928 V850 H355 V318 H340"></path>
  <g data-node="approve" data-kind="module"><rect class="module human" x="40" y="40" width="300" height="145" rx="3"></rect><foreignObject x="40" y="40" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Human / accountable engineer</xhtml:strong><xhtml:div>Confirm needs, risk tolerance, authority</xhtml:div><xhtml:div>Approve objective / domain changes</xhtml:div><xhtml:small>Expert entry ① Problem definition</xhtml:small></xhtml:div></foreignObject></g><g data-node="taskSpec" data-kind="artifact"><ellipse class="artifact" cx="600" cy="113" rx="150" ry="55"></ellipse><foreignObject x="450" y="58" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>Versioned engineering contract</xhtml:strong><xhtml:div>Needs / conditions / limits / acceptance</xhtml:div><xhtml:div>Budget / authorised actions</xhtml:div></xhtml:div></foreignObject></g><g data-node="planner" data-kind="module"><rect class="module agent" x="860" y="40" width="300" height="145" rx="3"></rect><foreignObject x="860" y="40" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Agent strategy layer</xhtml:strong><xhtml:div>Candidates, hypotheses, evidence gaps</xhtml:div><xhtml:div>Choose experiments / fidelity tiers</xhtml:div><xhtml:small>State rationale / expected learning; no self-acceptance</xhtml:small></xhtml:div></foreignObject></g><g data-node="modelOwner" data-kind="module"><rect class="module human" x="40" y="245" width="300" height="145" rx="3"></rect><foreignObject x="40" y="245" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Model / simulation expert</xhtml:strong><xhtml:div>Validate model, calibration, domain</xhtml:div><xhtml:div>Decide when stronger evidence is needed</xhtml:div><xhtml:small>Expert entry ② Model / evidence conflict</xhtml:small></xhtml:div></foreignObject></g><g data-node="registry" data-kind="artifact"><ellipse class="artifact" cx="600" cy="318" rx="150" ry="55"></ellipse><foreignObject x="450" y="263" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>Model / tool registry</xhtml:strong><xhtml:div>Version / cost / error / validity domain</xhtml:div><xhtml:div>I/O contract / observable variables</xhtml:div></xhtml:div></foreignObject></g><g data-node="plan" data-kind="artifact"><ellipse class="artifact" cx="1010" cy="318" rx="150" ry="55"></ellipse><foreignObject x="860" y="263" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>Experiment plan</xhtml:strong><xhtml:div>candidate / hypothesis / tool</xhtml:div><xhtml:div>purpose / expected_cost / stop</xhtml:div></xhtml:div></foreignObject></g><g data-node="runtime" data-kind="module"><rect class="module " x="860" y="445" width="300" height="145" rx="3"></rect><foreignObject x="860" y="445" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Durable execution control plane</xhtml:strong><xhtml:div>Admission / budget / leases / retries</xhtml:div><xhtml:div>Run → Candidate → Call → Attempt</xhtml:div><xhtml:small>Start modular-monolith; persist intent before execution</xhtml:small></xhtml:div></foreignObject></g><g data-node="worker" data-kind="module"><rect class="module " x="450" y="645" width="300" height="145" rx="3"></rect><foreignObject x="450" y="645" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Isolated worker / solver adapter</xhtml:strong><xhtml:div>Local process → remote executor / cluster</xhtml:div><xhtml:div>Permissions, resource caps, exits, logs</xhtml:div><xhtml:small>Scale to measured load; version-pinned solvers</xhtml:small></xhtml:div></foreignObject></g><g data-node="call" data-kind="artifact"><ellipse class="artifact" cx="1010" cy="718" rx="150" ry="55"></ellipse><foreignObject x="860" y="663" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>Call record / budget ledger</xhtml:strong><xhtml:div>Idempotency key / status / CPU core-hours</xhtml:div><xhtml:div>Wall time / memory / LLM / cache</xhtml:div></xhtml:div></foreignObject></g><g data-node="evidence" data-kind="artifact"><ellipse class="artifact" cx="190" cy="718" rx="150" ry="55"></ellipse><foreignObject x="40" y="663" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>Immutable evidence bundle</xhtml:strong><xhtml:div>Design + model + env + call identity</xhtml:div><xhtml:div>Fields / metrics / failures / public diagnostics</xhtml:div></xhtml:div></foreignObject></g><g data-node="gate" data-kind="module"><rect class="module " x="40" y="910" width="300" height="145" rx="3"></rect><foreignObject x="40" y="910" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Independent acceptance / eligibility</xhtml:strong><xhtml:div>Numerically valid → feasible → robust</xhtml:div><xhtml:div>Check evidence coverage / model domain</xhtml:div><xhtml:small>Private eval stays outside strategy context; failure can reject</xhtml:small></xhtml:div></foreignObject></g><g data-node="verdict" data-kind="artifact"><ellipse class="artifact" cx="600" cy="983" rx="150" ry="55"></ellipse><foreignObject x="450" y="928" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>Acceptance verdict</xhtml:strong><xhtml:div>eligible / rejected / need_expert</xhtml:div><xhtml:div>Evidence references / reasons / residual risk</xhtml:div></xhtml:div></foreignObject></g><g data-node="release" data-kind="module"><rect class="module human" x="860" y="910" width="300" height="145" rx="3"></rect><foreignObject x="860" y="910" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Release / engineering approval</xhtml:strong><xhtml:div>Eligibility + physical validation requirements</xhtml:div><xhtml:div>Authorised sign-off for consequential delivery</xhtml:div><xhtml:small>Expert entry ③ Release / risk ownership</xhtml:small></xhtml:div></foreignObject></g><g data-node="delivery" data-kind="artifact"><ellipse class="artifact" cx="1010" cy="1175" rx="150" ry="55"></ellipse><foreignObject x="860" y="1120" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>Delivery package</xhtml:strong><xhtml:div>Design / evidence / validity limits</xhtml:div><xhtml:div>Version / approval / reproduction guide</xhtml:div></xhtml:div></foreignObject></g>
  <text class="note" x="385" y="397" text-anchor="start">Only public diagnostics return to strategy; no repeated tuning on independent holdouts</text><text class="note" x="450" y="842" text-anchor="start">Write back costs after execution, including failures / timeouts / interruptions</text><text class="note" x="40" y="1087" text-anchor="start">Escalate: conflicting evidence / outside validity domain / risk beyond authority</text><text class="note" x="40" y="1268" text-anchor="start">Proposed, not implemented or load-tested. Scale at measured bottlenecks; no claimed node count, throughput, or SLO.</text></svg>