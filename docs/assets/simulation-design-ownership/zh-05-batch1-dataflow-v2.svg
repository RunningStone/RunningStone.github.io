  <g data-node="task" data-kind="module"><rect class="module human" x="40" y="75" width="300" height="145" rx="3"/><foreignObject x="40" y="75" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>人：定义与冻结任务</xhtml:strong><xhtml:div>变量、目标、模型、检查与预算</xhtml:div></xhtml:div></foreignObject></g><g data-node="contract" data-kind="artifact"><ellipse class="artifact" cx="600" cy="148" rx="150" ry="55"/><foreignObject x="450" y="93" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>Scenario + YAML</xhtml:strong><xhtml:div>目标 / bounds / eval_template</xhtml:div><xhtml:div>恢复菜单 / holdout / 30 步</xhtml:div></xhtml:div></foreignObject></g><g data-node="controller" data-kind="module"><rect class="module " x="860" y="75" width="300" height="145" rx="3"/><foreignObject x="860" y="75" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>控制器 / A 组提案</xhtml:strong><xhtml:div>父节点、回溯、停止与升阶</xhtml:div><xhtml:div>A：Nelder–Mead</xhtml:div><xhtml:small class="dependency-ref">依赖 D1 / D3 / D6</xhtml:small></xhtml:div></foreignObject></g><g data-node="sweep" data-kind="module"><rect class="module human" x="40" y="270" width="300" height="145" rx="3"/><foreignObject x="40" y="270" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>人编排：预扫描与摘要</xhtml:strong><xhtml:div>离线扫描 → 提炼先验</xhtml:div><xhtml:small class="dependency-ref">依赖 D2</xhtml:small></xhtml:div></foreignObject></g><g data-node="memory" data-kind="artifact"><ellipse class="artifact" cx="600" cy="342" rx="150" ry="55"/><foreignObject x="450" y="287" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>SENSITIVITY.md</xhtml:strong><xhtml:div>预扫描经验</xhtml:div><xhtml:div>只给有记忆的 B/C</xhtml:div></xhtml:div></foreignObject></g><g data-node="context" data-kind="artifact"><ellipse class="artifact" cx="1010" cy="342" rx="150" ry="55"/><foreignObject x="860" y="287" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>本步调度上下文</xhtml:strong><xhtml:div>parent / mode / task</xhtml:div><xhtml:div>起点与自动升阶可直接评估</xhtml:div></xhtml:div></foreignObject></g><g data-node="execute" data-kind="module"><rect class="module " x="40" y="475" width="300" height="145" rx="3"/><foreignObject x="40" y="475" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>固定模板 / Interpreter</xhtml:strong><xhtml:div>检查设计片段、拼装脚本</xhtml:div><xhtml:div>子进程执行与超时</xhtml:div><xhtml:small class="dependency-ref">依赖 D1</xhtml:small></xhtml:div></foreignObject></g><g data-node="proposal" data-kind="artifact"><ellipse class="artifact" cx="600" cy="547" rx="150" ry="55"/><foreignObject x="450" y="492" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>设计提案</xhtml:strong><xhtml:div>PARAMS / OPTIONS</xhtml:div><xhtml:div>假设 / prediction / kill criterion</xhtml:div></xhtml:div></foreignObject></g><g data-node="agent" data-kind="module"><rect class="module agent" x="860" y="475" width="300" height="145" rx="3"/><foreignObject x="860" y="475" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>DesignAgent：解读与提案</xhtml:strong><xhtml:div>消费父节点、历史与可选先验</xhtml:div><xhtml:div>B 看指标；C 另看场摘要</xhtml:div><xhtml:small class="dependency-ref">依赖 D1 / D2</xhtml:small></xhtml:div></foreignObject></g><g data-node="request" data-kind="artifact"><ellipse class="artifact" cx="190" cy="750" rx="150" ry="55"/><foreignObject x="40" y="695" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>求解请求</xhtml:strong><xhtml:div>参数 / OPTIONS / settings</xhtml:div><xhtml:div>输入哈希 → 查缓存</xhtml:div></xhtml:div></foreignObject></g><g data-node="simblock" data-kind="module"><rect class="module " x="450" y="675" width="300" height="145" rx="3"/><foreignObject x="450" y="675" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>simblock：翼型</xhtml:strong><xhtml:div>几何 → 网格 → 求解 → 后处理</xhtml:div><xhtml:small class="dependency-ref">依赖 D4</xhtml:small></xhtml:div></foreignObject></g><g data-node="battblock" data-kind="module"><rect class="module " x="860" y="675" width="300" height="145" rx="3"/><foreignObject x="860" y="675" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>battblock：电池</xhtml:strong><xhtml:div>tier 0 集总热；tier 2 固定点耦合</xhtml:div><xhtml:div>PyBaMM 生热 ↔ OpenFOAM 温度</xhtml:div><xhtml:small class="dependency-ref">依赖 D4 / D5</xhtml:small></xhtml:div></foreignObject></g><g data-node="scoring" data-kind="module"><rect class="module " x="40" y="895" width="300" height="145" rx="3"/><foreignObject x="40" y="895" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>固定规则：数值门与计分</xhtml:strong><xhtml:div>trust → 接受观测或无分数</xhtml:div><xhtml:div>forces / objectives → J 或 Jᵦ</xhtml:div></xhtml:div></foreignObject></g><g data-node="raw" data-kind="artifact"><ellipse class="artifact" cx="600" cy="973" rx="150" ry="60"/><foreignObject x="450" y="913" width="300" height="120"><xhtml:div class="node-text artifact-text"><xhtml:strong>CaseResult + 原始文件</xhtml:strong><xhtml:div>力 / 温度 / trust / failure</xhtml:div><xhtml:div>field_summary / provenance / 场文件</xhtml:div></xhtml:div></foreignObject></g><g data-node="eval" data-kind="artifact"><ellipse class="artifact" cx="190" cy="1150" rx="150" ry="55"/><foreignObject x="40" y="1095" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>EVAL_JSON</xhtml:strong><xhtml:div>metric / summary / result</xhtml:div><xhtml:div>params / options / is_bug</xhtml:div></xhtml:div></foreignObject></g><g data-node="record" data-kind="module"><rect class="module " x="450" y="1080" width="300" height="145" rx="3"/><foreignObject x="450" y="1080" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>解析与实验记录</xhtml:strong><xhtml:div>Journal Node；每 case Git commit</xhtml:div><xhtml:div>每 10 case 抽查 verify</xhtml:div><xhtml:small class="dependency-ref">依赖 D1 / D6</xhtml:small></xhtml:div></foreignObject></g><g data-node="history" data-kind="artifact"><ellipse class="artifact" cx="1010" cy="1150" rx="150" ry="55"/><foreignObject x="860" y="1095" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>运行内历史与谱系</xhtml:strong><xhtml:div>journal / cases / Git SHA</xhtml:div><xhtml:div>结果 + 提案 + 父子关系</xhtml:div></xhtml:div></foreignObject></g><g data-node="select" data-kind="module"><rect class="module issue" x="860" y="1275" width="300" height="145" rx="3"/><foreignObject x="860" y="1275" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>旧选择器：按分数取 best</xhtml:strong><xhtml:div>同池比较 tier 0 与 tier 2</xhtml:div><xhtml:div>尚未按验证资格筛候选</xhtml:div></xhtml:div></foreignObject></g><g data-node="selected" data-kind="artifact"><ellipse class="artifact" cx="600" cy="1347" rx="150" ry="55"/><foreignObject x="450" y="1292" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>原 selected best</xhtml:strong><xhtml:div>候选参数 / tier / options</xhtml:div><xhtml:div>名义分数</xhtml:div></xhtml:div></foreignObject></g><g data-node="holdout" data-kind="module"><rect class="module " x="40" y="1275" width="300" height="145" rx="3"/><foreignObject x="40" y="1275" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>运行后：扰动检查</xhtml:strong><xhtml:div>h/c ±0.01 或 C-rate ±0.1</xhtml:div><xhtml:div>保持所选 tier；结果不回流策略</xhtml:div></xhtml:div></foreignObject></g><g data-node="checks" data-kind="artifact"><ellipse class="artifact" cx="190" cy="1550" rx="150" ry="55"/><foreignObject x="40" y="1495" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>summary + holdout</xhtml:strong><xhtml:div>扰动 metric / 原 robust</xhtml:div><xhtml:div>原 robust 仅要求数值可计分</xhtml:div></xhtml:div></foreignObject></g><g data-node="recheck" data-kind="module"><rect class="module human" x="450" y="1475" width="300" height="145" rx="3"/><foreignObject x="450" y="1475" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>事后统一复核 / 汇总</xhtml:strong><xhtml:div>电池终点统一 tier 2</xhtml:div><xhtml:div>完整历史发现率 vs 终点可行率</xhtml:div></xhtml:div></foreignObject></g><g data-node="report" data-kind="artifact"><ellipse class="artifact" cx="1010" cy="1550" rx="150" ry="55"/><foreignObject x="860" y="1495" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>报告与对比图</xhtml:strong><xhtml:div>12 次曾找到；6 次选对</xhtml:div><xhtml:div>此处没有自动重选链路</xhtml:div></xhtml:div></foreignObject></g><g data-node="dep1" data-kind="module"><rect class="module external" x="40" y="1730" width="300" height="100" rx="3"/><foreignObject x="40" y="1730" width="300" height="100"><xhtml:div class="node-text "><xhtml:strong>D1 · AIDE</xhtml:strong><xhtml:div>Agent / Interpreter / Journal</xhtml:div></xhtml:div></foreignObject></g><g data-node="dep2" data-kind="module"><rect class="module external" x="450" y="1730" width="300" height="100" rx="3"/><foreignObject x="450" y="1730" width="300" height="100"><xhtml:div class="node-text "><xhtml:strong>D2 · LLM / Claude CLI</xhtml:strong><xhtml:div>设计提案与解读</xhtml:div></xhtml:div></foreignObject></g><g data-node="dep3" data-kind="module"><rect class="module external" x="860" y="1730" width="300" height="100" rx="3"/><foreignObject x="860" y="1730" width="300" height="100"><xhtml:div class="node-text "><xhtml:strong>D3 · SciPy</xhtml:strong><xhtml:div>A 组数值优化</xhtml:div></xhtml:div></foreignObject></g><g data-node="dep4" data-kind="module"><rect class="module external" x="40" y="1860" width="300" height="100" rx="3"/><foreignObject x="40" y="1860" width="300" height="100"><xhtml:div class="node-text "><xhtml:strong>D4 · Gmsh / OpenFOAM</xhtml:strong><xhtml:div>几何网格、流动与传热</xhtml:div></xhtml:div></foreignObject></g><g data-node="dep5" data-kind="module"><rect class="module external" x="450" y="1860" width="300" height="100" rx="3"/><foreignObject x="450" y="1860" width="300" height="100"><xhtml:div class="node-text "><xhtml:strong>D5 · PyBaMM</xhtml:strong><xhtml:div>电化学与生热</xhtml:div></xhtml:div></foreignObject></g><g data-node="dep6" data-kind="module"><rect class="module external" x="860" y="1860" width="300" height="100" rx="3"/><foreignObject x="860" y="1860" width="300" height="100"><xhtml:div class="node-text "><xhtml:strong>D6 · 运行与配置库</xhtml:strong><xhtml:div>Git / Python / YAML / OmegaConf</xhtml:div></xhtml:div></foreignObject></g>
  <text class="note" x="365" y="418" text-anchor="start">虚线箭头：A / 第 0 步 / 自动升阶；绕过 LLM</text><text class="note" x="525" y="869" text-anchor="start">按场景二选一；命中缓存时复用已保存结果</text><text class="note" x="1070" y="1257" text-anchor="start">停止后</text><text class="note" x="40" y="1700" text-anchor="start">框外蓝色：外部依赖；框内蓝色标签按 D1–D6 引用，不表示数据流。详细文件与依赖见附录。</text></svg>