<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" viewBox="0 0 1240 2000" role="img" aria-labelledby="batch1-title batch1-desc"><title id="batch1-title">Batch 1 历史实现：模块、产物与数据流</title><desc id="batch1-desc">方块是执行模块，椭圆是数据产物。每条箭头表示生产者、数据产物与消费者之间的数据传递。人：定义与冻结任务；Scenario + YAML；控制器 / A 组提案；人编排：预扫描与摘要；SENSITIVITY.md；本步调度上下文；固定模板 / Interpreter；设计提案；DesignAgent：解读与提案；求解请求；simblock：翼型；battblock：电池；固定规则：数值门与计分；CaseResult + 原始文件；EVAL_JSON；解析与实验记录；运行内历史与谱系；旧选择器：按分数取 best；原 selected best；运行后：扰动检查；summary + holdout；事后统一复核 / 汇总；报告与对比图；D1 · AIDE；D2 · LLM / Claude CLI；D3 · SciPy；D4 · Gmsh / OpenFOAM；D5 · PyBaMM；D6 · 运行与配置库</desc><style>.module{fill:#f3f5f4;stroke:#bccbca;stroke-width:1.4}.module.agent{fill:#fff5f2;stroke:#b4473e;stroke-width:2.8}.module.external{fill:#edf5fc;stroke:#4282b3;stroke-width:1.8}.module.human{fill:#faf3e7;stroke:#ccb78e}.module.issue{fill:#fff0e8;stroke:#cc947e}.artifact{fill:#eef7f2;stroke:#6d9c8a;stroke-width:1.4}.edge{fill:none;stroke:#48636c;stroke-width:1.6;marker-end:url(#batch1-arrow)}.bypass{stroke-dasharray:6 4}.node-text{box-sizing:border-box;height:100%;display:flex;flex-direction:column;justify-content:center;gap:7px;text-align:center;font:15px/1.45 'PingFang SC','Microsoft YaHei',sans-serif;color:#163549;padding:10px 16px}.node-text strong{font-size:18px;font-weight:600}.node-text small{font-size:12px;color:#52666b;line-height:1.35}.node-text .dependency-ref{color:#245e8d;background:#e6f1fa;border:1px solid #b3cfe3;padding:3px 5px;font-size:11px}.artifact-text{padding:12px 27px;font-size:14px}.artifact-text strong{font-size:16px}.note{font:13px 'PingFang SC',sans-serif;fill:#52666b}.group-boundary{fill:none;stroke:#819592;stroke-width:1.6;stroke-dasharray:9 6}.group-title{font:600 17px 'PingFang SC',sans-serif;fill:#173447}.source{font-family:monospace;font-size:12px}</style><defs><marker id="batch1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path 