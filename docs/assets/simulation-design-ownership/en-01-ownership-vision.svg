<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="compact-vision-title compact-vision-desc">
  <title id="compact-vision-title">Agent design workflow in NASA’s original layout</title><desc id="compact-vision-desc">Expectations at upper left, requirements at upper right, decomposition at lower right, solution iteration below centre. A decision on the left recurses or enters product realisation. Three dashed groups show jointly clarified expectations, jointly anchored requirements, and Agent iteration. Simulation and physical evidence follow distinct paths.</desc>
  <style>
  .cv-panel{stroke:#aab8b2;stroke-width:1.2}.cv-boundary{fill:none;stroke:#7c918a;stroke-width:1.4;stroke-dasharray:7 5}.cv-group-title{font:600 16px 'PingFang SC',sans-serif;fill:#173447}.cv-heading{font:600 17px 'PingFang SC',sans-serif;fill:#173447}.cv-label{font:14px 'PingFang SC',sans-serif;fill:#3c5660}.cv-note{font:13px 'PingFang SC',sans-serif;fill:#52676f}.cv-node{fill:#fff;stroke:#9bafa7;stroke-width:1.2}.cv-node.human{fill:#fff8ec;stroke:#bd9c63}.cv-node.agent{fill:#fff8f5;stroke:#b4473e;stroke-width:2}.cv-text{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;padding:6px 8px;text-align:center;font:14px/1.3 'PingFang SC',sans-serif;color:#173447}.cv-text strong{font-size:15px;font-weight:600}.cv-decision{fill:white;stroke:#758b85;stroke-width:1.4}.cv-arrow{fill:none;stroke:#435c62;stroke-width:1.5;marker-end:url(#compact-vision-arrow)}.cv-arrow.feedback{stroke-dasharray:5 3}
  .cv-text{font-size:12px;line-height:1.2}.cv-text strong{font-size:13px}.node-text{font-size:14px;line-height:1.35;gap:5px}.node-text strong{font-size:16px}.artifact-text{font-size:13px}.cv-group-title{font-size:15px}.cv-heading{font-size:16px}</style><defs><marker id="compact-vision-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#435c62"></path></marker></defs>
  <g data-group="co-clarify"><rect class="cv-boundary" x="148" y="54" width="302" height="301" rx="5"></rect><text class="cv-group-title" x="162" y="78">① Human + AI: clarify expectations</text></g>
  <g data-group="co-anchor"><rect class="cv-boundary" x="478" y="54" width="690" height="301" rx="5"></rect><text class="cv-group-title" x="492" y="78">② Human + AI: anchor requirements</text></g>
  <g data-group="agent-iterate"><rect class="cv-boundary" x="339" y="392" width="829" height="335" rx="5"></rect><text class="cv-group-title" x="353" y="417">③ Agent owns authorised iterations; humans review direction and results</text></g>
  <rect data-zone="expectations" class="cv-panel" x="158" y="90" width="282" height="255" fill="#edf4e8"></rect>
  <rect data-zone="requirements" class="cv-panel" x="488" y="90" width="670" height="255" fill="#fcf0de"></rect>
  <rect data-zone="solution" class="cv-panel" x="349" y="434" width="525" height="282" fill="#eef5e8"></rect>
  <rect data-zone="decomposition" class="cv-panel" x="932" y="434" width="224" height="282" fill="#fff0e2"></rect>
  <text class="cv-heading" text-anchor="middle" x="299" y="117">Stakeholder Expectations</text>
  <text class="cv-label" text-anchor="middle" x="299" y="141">Clarification · Stakeholder + AI</text>
