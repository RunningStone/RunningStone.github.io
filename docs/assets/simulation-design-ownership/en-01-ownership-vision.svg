  <g data-node="authority" data-kind="module"><rect class="cv-node human" x="12" y="211" width="120" height="66" rx="3"></rect><foreignObject x="12" y="211" width="120" height="66"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Authorisation</strong><span>Human sets mission</span></div></foreignObject></g>
  <g data-node="needs" data-kind="module"><rect class="cv-node " x="170" y="162" width="125" height="48" rx="3"></rect><foreignObject x="170" y="162" width="125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Needs / goals</strong><span>Human input</span></div></foreignObject></g>
  <g data-node="constraints" data-kind="module"><rect class="cv-node " x="170" y="220" width="125" height="48" rx="3"></rect><foreignObject x="170" y="220" width="125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Constraints / trades</strong><span>Clarify together</span></div></foreignObject></g>
  <g data-node="success" data-kind="module"><rect class="cv-node " x="170" y="278" width="125" height="48" rx="3"></rect><foreignObject x="170" y="278" width="125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Success criteria</strong><span>AI probes ambiguity</span></div></foreignObject></g>
  <g data-node="conops" data-kind="module"><rect class="cv-node " x="322" y="206" width="106" height="64" rx="3"></rect><foreignObject x="322" y="206" width="106" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>ConOps</strong><span>Use context</span></div></foreignObject></g>
  <g data-node="technical" data-kind="module"><rect class="cv-node human" x="505" y="171" width="170" height="129" rx="3"></rect><foreignObject x="505" y="171" width="170" height="129"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Technical requirements</strong><span>Metrics / thresholds</span><span>Evidence / evaluation</span><span>Budget / change authority</span></div></foreignObject></g>
  <g data-node="validate" data-kind="decision"><path class="cv-decision" d="M750 192 L807.5 235 L750 278 L692.5 235 Z"></path><text class="cv-label" text-anchor="middle" x="750" y="227"><tspan x="750" dy="0">Validate</tspan><tspan x="750" dy="19">Consistent?</tspan></text></g>
  <g data-node="meet-conops" data-kind="decision"><path class="cv-decision" d="M974 190 L1048 235 L974 280 L900 235 Z"></path><text class="cv-label" text-anchor="middle" x="974" y="227"><tspan x="974" dy="0">Meets ConOps</tspan><tspan x="974" dy="19">and criteria?</tspan></text></g>
  <g data-node="decomposition" data-kind="module"><rect class="cv-node agent" x="948" y="497" width="192" height="56" rx="3"></rect><foreignObject x="948" y="497" width="192" height="56"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Architecture / subproblems</strong><span>Functions / interfaces / coupling</span></div></foreignObject></g>
  <g data-node="derived" data-kind="module"><rect class="cv-node agent" x="948" y="579" width="192" height="64" rx="3"></rect><foreignObject x="948" y="579" width="192" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Derived needs / evidence gaps</strong><span>Conditions / fidelity / budget</span></div></foreignObject></g>
  <g data-node="criteria" data-kind="module"><rect class="cv-node " x="365" y="480" width="200" height="55" rx="3"></rect><foreignObject x="365" y="480" width="200" height="55"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Success criteria / ConOps</strong><span>Evaluate against requirements</span></div></foreignObject></g>
  <g data-node="proposal" data-kind="module"><rect class="cv-node agent" x="664" y="480" width="195" height="55" rx="3"></rect><foreignObject x="664" y="480" width="195" height="55"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Agent: design / experiments</strong><span>Choose parameters / models in budget</span></div></foreignObject></g>
  <g data-node="simulation" data-kind="module"><rect class="cv-node agent" x="365" y="563" width="224" height="64" rx="3"></rect><foreignObject x="365" y="563" width="224" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Simulation · Agent executes</strong><span>Simulation, numerical checks, controls</span></div></foreignObject></g>
  <g data-node="physical" data-kind="module"><rect class="cv-node human" x="635" y="563" width="224" height="64" rx="3"></rect><foreignObject x="635" y="563" width="224" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Physical world · Human involved</strong><span>Manufacture, test, measure</span></div></foreignObject></g>
  <g data-node="learn" data-kind="module"><rect class="cv-node agent" x="480" y="651" width="283" height="53" rx="3"></rect><foreignObject x="480" y="651" width="283" height="53"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Agent: compare and update beliefs</strong><span>Interpret evidence → revise hypotheses / designs</span></div></foreignObject></g>
  <g data-node="lowest-level" data-kind="decision"><path class="cv-decision" d="M225 551 L273 589 L225 627 L177 589 Z"></path><text class="cv-label" text-anchor="middle" x="225" y="581"><tspan x="225" dy="0">Lowest</tspan><tspan x="225" dy="19">level?</tspan></text></g>
  <g data-node="realization" data-kind="module"><rect class="cv-node human" x="10" y="557" width="128" height="64" rx="3"></rect><foreignObject x="10" y="557" width="128" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Product realisation</strong><span>Human validation / release</span></div></foreignObject></g>
  <text class="cv-note" x="589" y="155">Inconsistent: revise</text>
  <text class="cv-note" x="650" y="19">Use context not met → revisit expectations / requirements</text>
  <text class="cv-label" x="838" y="224">Yes</text><text class="cv-label" x="1094" y="222">Pass</text>
  <text class="cv-label" x="884" y="496">Allocate</text><text class="cv-label" x="593" y="496">Design</text>
  <text class="cv-label" x="151" y="579">Yes</text><text class="cv-label" x="90" y="400">No: recurse to next level</text>
  <text class="cv-note" x="350" y="751">Added: human–AI roles and simulation / physical evidence paths. Process positions and recursion follow NASA’s original.</text>
