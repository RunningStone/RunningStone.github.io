<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" viewBox="0 0 1240 1290" role="img" aria-labelledby="industrial-title industrial-desc"><title id="industrial-title">建议工业架构：搜索权、证据与验收资格分离</title><desc id="industrial-desc">方块是执行模块，椭圆是数据产物。每条箭头表示生产者、数据产物与消费者之间的数据传递。人 / 责任工程师；版本化工程契约；Agent 策略层；模型 / 仿真专家；模型 / 工具注册表；试验计划；持久化执行控制面；隔离 worker / 求解器适配器；调用记录与预算账本；不可变证据包；独立验收与候选资格；验收结论；发布 / 工程审批；交付包</desc><style>.module{fill:#f3f5f4;stroke:#bccbca;stroke-width:1.4}.module.agent{fill:#fff5f2;stroke:#b4473e;stroke-width:2.8}.module.external{fill:#edf5fc;stroke:#4282b3;stroke-width:1.8}.module.human{fill:#faf3e7;stroke:#ccb78e}.module.issue{fill:#fff0e8;stroke:#cc947e}.artifact{fill:#eef7f2;stroke:#6d9c8a;stroke-width:1.4}.edge{fill:none;stroke:#48636c;stroke-width:1.6;marker-end:url(#industrial-arrow)}.bypass{stroke-dasharray:6 4}.node-text{box-sizing:border-box;height:100%;display:flex;flex-direction:column;justify-content:center;gap:7px;text-align:center;font:15px/1.45 'PingFang SC','Microsoft YaHei',sans-serif;color:#163549;padding:10px 16px}.node-text strong{font-size:18px;font-weight:600}.node-text small{font-size:12px;color:#52666b;line-height:1.35}.node-text .dependency-ref{color:#245e8d;background:#e6f1fa;border:1px solid #b3cfe3;padding:3px 5px;font-size:11px}.artifact-text{padding:12px 27px;font-size:14px}.artifact-text strong{font-size:16px}.note{font:13px 'PingFang SC',sans-serif;fill:#52666b}.group-boundary{fill:none;stroke:#819592;stroke-width:1.6;stroke-dasharray:9 6}.group-title{font:600 17px 'PingFang SC',sans-serif;fill:#173447}.source{font-family:monospace;font-size:12px}</style><defs><marker id="industrial-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#48636c"/></marker></defs>
  
  <path class="edge " data-from="approve" data-to="taskSpec" d="M340 112 H450"/><path class="edge " data-from="taskSpec" data-to="planner" d="M750 112 H860"/><path class="edge " data-from="modelOwner" data-to="registry" d="M340 317 H450"/><path class="edge " data-from="registry" data-to="planner" d="M750 318 H805 V154 H860"/><path class="edge " data-from="planner" data-to="plan" d="M1010 185 V263"/><path class="edge " data-from="plan" data-to="runtime" d="M1010 373 V445"/><path class="edge " data-from="runtime" data-to="call" d="M1010 590 V663"/><path class="edge " data-from="call" data-to="worker" d="M860 718 H750"/><path class="edge " data-from="worker" data-to="call" d="M600 790 V813 H1010 V773"/><path class="edge " data-from="worker" data-to="evidence" d="M450 718 H340"/><path class="edge " data-from="evidence" data-to="gate" d="M190 773 V910"/><path class="edge " data-from="gate" data-to="verdict" d="M340 983 H450"/><path class="edge " data-from="verdict" data-to="release" d="M750 983 H860"/><path class="edge " data-from="release" data-to="delivery" d="M1010 1055 V1120"/><path class="edge " data-from="taskSpec" data-to="gate" d="M600 168 V215 H18 V982 H40"/><path class="edge " data-from="registry" data-to="worker" d="M600 373 V645"/><path class="edge " data-from="registry" data-to="gate" d="M600 373 V600 H375 V875 H190 V910"/><path class="edge " data-from="evidence" data-to="planner" d="M190 663 V410 H1210 V110 H1160"/><path class="edge " data-from="call" data-to="planner" d="M1160 718 H1185 V155 H1160"/><path class="edge " data-from="verdict" data-to="modelOwner" d="M600 928 V850 H355 V318 H340"/>
  <g data-node="approve" data-kind="module"><rect class="module human" x="40" y="40" width="300" height="145" rx="3"/><foreignObject x="40" y="40" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>人 / 责任工程师</xhtml:strong><xhtml:div>确认需求、风险容忍与权限</xhtml:div><xhtml:div>批准目标或适用域变化</xhtml:div><xhtml:small>专家接入点 ① 问题定义</xhtml:small></xhtml:div></foreignObject></g><g data-node="taskSpec" data-kind="artifact"><ellipse class="artifact" cx="600" cy="113" rx="150" ry="55"/><foreignObject x="450" y="58" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>版本化工程契约</xhtml:strong><xhtml:div>需求 / 工况 / 约束 / 验收</xhtml:div><xhtml:div>预算与可操作范围</xhtml:div></xhtml:div></foreignObject></g><g data-node="planner" data-kind="module"><rect class="module agent" x="860" y="40" width="300" height="145" rx="3"/><foreignObject x="860" y="40" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>Agent 策略层</xhtml:strong><xhtml:div>候选、假设、证据缺口</xhtml:div><xhtml:div>选择实验与模型层级</xhtml:div><xhtml:small>输出理由与预期信息；不是自我验收者</xhtml:small></xhtml:div></foreignObject></g><g data-node="modelOwner" data-kind="module"><rect class="module human" x="40" y="245" width="300" height="145" rx="3"/><foreignObject x="40" y="245" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>模型 / 仿真专家</xhtml:strong><xhtml:div>验证模型、校准与适用域</xhtml:div><xhtml:div>决定何时需要更强的证据</xhtml:div><xhtml:small>专家接入点 ② 模型与证据冲突</xhtml:small></xhtml:div></foreignObject></g><g data-node="registry" data-kind="artifact"><ellipse class="artifact" cx="600" cy="318" rx="150" ry="55"/><foreignObject x="450" y="263" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>模型 / 工具注册表</xhtml:strong><xhtml:div>版本 / 成本 / 误差与适用域</xhtml:div><xhtml:div>输入输出契约 / 可观测变量</xhtml:div></xhtml:div></foreignObject></g><g data-node="plan" data-kind="artifact"><ellipse class="artifact" cx="1010" cy="318" rx="150" ry="55"/><foreignObject x="860" y="263" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>试验计划</xhtml:strong><xhtml:div>candidate / hypothesis / tool</xhtml:div><xhtml:div>purpose / expected_cost / stop</xhtml:div></xhtml:div></foreignObject></g><g data-node="runtime" data-kind="module"><rect class="module " x="860" y="445" width="300" height="145" rx="3"/><foreignObject x="860" y="445" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>持久化执行控制面</xhtml:strong><xhtml:div>准入 / 预算预留 / 租约 / 重试</xhtml:div><xhtml:div>Run → Candidate → Call → Attempt</xhtml:div><xhtml:small>模块化单体起步；任务状态在执行前落盘</xhtml:small></xhtml:div></foreignObject></g><g data-node="worker" data-kind="module"><rect class="module " x="450" y="645" width="300" height="145" rx="3"/><foreignObject x="450" y="645" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>隔离 worker / 求解器适配器</xhtml:strong><xhtml:div>本地进程 → 远程 executor / 集群</xhtml:div><xhtml:div>权限、资源上限、退出码与日志</xhtml:div><xhtml:small>按实测并发扩展；固定版本物理求解器</xhtml:small></xhtml:div></foreignObject></g><g data-node="call" data-kind="artifact"><ellipse class="artifact" cx="1010" cy="718" rx="150" ry="55"/><foreignObject x="860" y="663" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>调用记录与预算账本</xhtml:strong><xhtml:div>幂等键 / 状态 / CPU 核时</xhtml:div><xhtml:div>墙钟 / 内存 / LLM / 缓存</xhtml:div></xhtml:div></foreignObject></g><g data-node="evidence" data-kind="artifact"><ellipse class="artifact" cx="190" cy="718" rx="150" ry="55"/><foreignObject x="40" y="663" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>不可变证据包</xhtml:strong><xhtml:div>design + model + env + call 身份</xhtml:div><xhtml:div>场 / 指标 / 失败 / 公开诊断</xhtml:div></xhtml:div></foreignObject></g><g data-node="gate" data-kind="module"><rect class="module " x="40" y="910" width="300" height="145" rx="3"/><foreignObject x="40" y="910" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>独立验收与候选资格</xhtml:strong><xhtml:div>数值有效 → 工程合格 → 鲁棒</xhtml:div><xhtml:div>检查证据完整性与模型适用域</xhtml:div><xhtml:small>私有 Eval 不进入策略上下文；失败可拒绝资格</xhtml:small></xhtml:div></foreignObject></g><g data-node="verdict" data-kind="artifact"><ellipse class="artifact" cx="600" cy="983" rx="150" ry="55"/><foreignObject x="450" y="928" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>验收结论</xhtml:strong><xhtml:div>eligible / rejected / need_expert</xhtml:div><xhtml:div>证据引用 / 原因 / 剩余风险</xhtml:div></xhtml:div></foreignObject></g><g data-node="release" data-kind="module"><rect class="module human" x="860" y="910" width="300" height="145" rx="3"/><foreignObject x="860" y="910" width="300" height="145"><xhtml:div class="node-text "><xhtml:strong>发布 / 工程审批</xhtml:strong><xhtml:div>资格门 + 实物验证要求</xhtml:div><xhtml:div>高后果交付由授权责任人批准</xhtml:div><xhtml:small>专家接入点 ③ 放行与风险承担</xhtml:small></xhtml:div></foreignObject></g><g data-node="delivery" data-kind="artifact"><ellipse class="artifact" cx="1010" cy="1175" rx="150" ry="55"/><foreignObject x="860" y="1120" width="300" height="110"><xhtml:div class="node-text artifact-text"><xhtml:strong>交付包</xhtml:strong><xhtml:div>设计 / 证据 / 适用边界</xhtml:div><xhtml:div>版本 / 审批 / 复现说明</xhtml:div></xhtml:div></foreignObject></g>
  <text class="note" x="385" y="397" text-anchor="start">仅公开诊断回流策略；独立留出结果不用于反复调参</text><text class="note" x="450" y="842" text-anchor="start">计算后回写账本；失败 / 超时 / 中断同样落账</text><text class="note" x="40" y="1087" text-anchor="start">升级给专家：证据冲突 / 越出适用域 / 超授权风险</text><text class="note" x="40" y="1268" text-anchor="start">建议架构，尚未实现或做规模验证。按真实资源瓶颈扩容，不预先承诺节点数、吞吐量或 SLO。</text></svg>