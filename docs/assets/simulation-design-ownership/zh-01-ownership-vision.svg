  <g data-node="meet-conops" data-kind="decision"><path class="cv-decision" d="M974 190 L1048 235 L974 280 L900 235 Z"/><text class="cv-label" text-anchor="middle" x="974" y="227"><tspan x="974" dy="0">满足 ConOps</tspan><tspan x="974" dy="19">与成功标准？</tspan></text></g>
  <g data-node="decomposition" data-kind="module"><rect class="cv-node agent" x="948" y="497" width="192" height="56" rx="3"/><foreignObject x="948" y="497" width="192" height="56"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>架构与子问题</strong><span>功能 / 接口 / 耦合</span></div></foreignObject></g>
  <g data-node="derived" data-kind="module"><rect class="cv-node agent" x="948" y="579" width="192" height="64" rx="3"/><foreignObject x="948" y="579" width="192" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>派生要求与证据缺口</strong><span>工况 / 模型层级 / 预算</span></div></foreignObject></g>
  <g data-node="criteria" data-kind="module"><rect class="cv-node " x="365" y="480" width="200" height="55" rx="3"/><foreignObject x="365" y="480" width="200" height="55"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>成功标准 / ConOps</strong><span>按需求评估证据</span></div></foreignObject></g>
  <g data-node="proposal" data-kind="module"><rect class="cv-node agent" x="664" y="480" width="195" height="55" rx="3"/><foreignObject x="664" y="480" width="195" height="55"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Agent：设计与试验</strong><span>预算内选择参数 / 模型</span></div></foreignObject></g>
  <g data-node="simulation" data-kind="module"><rect class="cv-node agent" x="365" y="563" width="224" height="64" rx="3"/><foreignObject x="365" y="563" width="224" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>模拟世界 · Agent 执行</strong><span>仿真、数值检查与对照</span></div></foreignObject></g>
  <g data-node="physical" data-kind="module"><rect class="cv-node human" x="635" y="563" width="224" height="64" rx="3"/><foreignObject x="635" y="563" width="224" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>物理世界 · 人类介入</strong><span>实物制造、试验与测量</span></div></foreignObject></g>
  <g data-node="learn" data-kind="module"><rect class="cv-node agent" x="480" y="651" width="283" height="53" rx="3"/><foreignObject x="480" y="651" width="283" height="53"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>Agent：比较并更新认识</strong><span>理解证据 → 修正假设与设计</span></div></foreignObject></g>
  <g data-node="lowest-level" data-kind="decision"><path class="cv-decision" d="M225 551 L273 589 L225 627 L177 589 Z"/><text class="cv-label" text-anchor="middle" x="225" y="581"><tspan x="225" dy="0">已到</tspan><tspan x="225" dy="19">最低层？</tspan></text></g>
  <g data-node="realization" data-kind="module"><rect class="cv-node human" x="10" y="557" width="128" height="64" rx="3"/><foreignObject x="10" y="557" width="128" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>进入产品实现</strong><span>人类验证 / 放行</span></div></foreignObject></g>
