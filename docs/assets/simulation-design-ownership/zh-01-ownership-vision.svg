<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="compact-vision-title compact-vision-desc">
  <title id="compact-vision-title">沿用 NASA 原图布局的 Agent 设计流程</title><desc id="compact-vision-desc">左上期望澄清、右上需求锚定、右下逻辑分解、下中设计方案迭代；左侧判断是否到达最低层，返回上层需求或进入产品实现。三段虚线框分别标出人机共建期望、人机共建工程需求、Agent 自主迭代。方案迭代中区分模拟世界和实物世界。</desc>
  <style>
  .cv-panel{stroke:#aab8b2;stroke-width:1.2}.cv-boundary{fill:none;stroke:#7c918a;stroke-width:1.4;stroke-dasharray:7 5}.cv-group-title{font:600 16px 'PingFang SC',sans-serif;fill:#173447}.cv-heading{font:600 17px 'PingFang SC',sans-serif;fill:#173447}.cv-label{font:14px 'PingFang SC',sans-serif;fill:#3c5660}.cv-note{font:13px 'PingFang SC',sans-serif;fill:#52676f}.cv-node{fill:#fff;stroke:#9bafa7;stroke-width:1.2}.cv-node.human{fill:#fff8ec;stroke:#bd9c63}.cv-node.agent{fill:#fff8f5;stroke:#b4473e;stroke-width:2}.cv-text{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;padding:6px 8px;text-align:center;font:14px/1.3 'PingFang SC',sans-serif;color:#173447}.cv-text strong{font-size:15px;font-weight:600}.cv-decision{fill:white;stroke:#758b85;stroke-width:1.4}.cv-arrow{fill:none;stroke:#435c62;stroke-width:1.5;marker-end:url(#compact-vision-arrow)}.cv-arrow.feedback{stroke-dasharray:5 3}
  </style><defs><marker id="compact-vision-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#435c62"/></marker></defs>
  <g data-group="co-clarify"><rect class="cv-boundary" x="148" y="54" width="302" height="301" rx="5"/><text class="cv-group-title" x="162" y="78">① 人机共建：澄清期望</text></g>
  <g data-group="co-anchor"><rect class="cv-boundary" x="478" y="54" width="690" height="301" rx="5"/><text class="cv-group-title" x="492" y="78">② 人机共建：锚定工程需求</text></g>
  <g data-group="agent-iterate"><rect class="cv-boundary" x="339" y="392" width="829" height="335" rx="5"/><text class="cv-group-title" x="353" y="417">③ Agent own 授权内迭代；人审核方向与结果</text></g>
