  <g data-node="needs" data-kind="module"><rect class="cv-node " x="170" y="162" width="125" height="48" rx="3"/><foreignObject x="170" y="162" width="125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>需求与目标</strong><span>人提出任务</span></div></foreignObject></g>
  <g data-node="constraints" data-kind="module"><rect class="cv-node " x="170" y="220" width="125" height="48" rx="3"/><foreignObject x="170" y="220" width="125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>约束与取舍</strong><span>共同澄清</span></div></foreignObject></g>
  <g data-node="success" data-kind="module"><rect class="cv-node " x="170" y="278" width="125" height="48" rx="3"/><foreignObject x="170" y="278" width="125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>成功标准</strong><span>AI 追问歧义</span></div></foreignObject></g>
  <g data-node="conops" data-kind="module"><rect class="cv-node " x="322" y="206" width="106" height="64" rx="3"/><foreignObject x="322" y="206" width="106" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="cv-text"><strong>ConOps</strong><span>使用情境</span></div></foreignObject></g>
