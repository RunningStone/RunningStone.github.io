<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Georgia, 'Times New Roman', serif" font-size="13">
  <g stroke="#9a9a9a" stroke-width="2">
    <line x1="60" y1="130" x2="108" y2="130"/>
    <line x1="108" y1="130" x2="156" y2="130"/>
    <line x1="204" y1="130" x2="252" y2="130"/>
    <line x1="252" y1="130" x2="300" y2="130"/>
  </g>
  <line x1="156" y1="130" x2="204" y2="130" stroke="#d64545" stroke-width="3"/>
  <line x1="180" y1="60" x2="180" y2="200" stroke="#666" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g fill="#ffffff" stroke="#444" stroke-width="1.8">
    <circle cx="60" cy="130" r="9"/><circle cx="108" cy="130" r="9"/><circle cx="156" cy="130" r="9"/>
    <circle cx="204" cy="130" r="9"/><circle cx="252" cy="130" r="9"/><circle cx="300" cy="130" r="9"/>
  </g>
  <text x="108" y="52" fill="#777" text-anchor="middle" font-style="italic">agent A</text>
  <text x="252" y="52" fill="#777" text-anchor="middle" font-style="italic">agent B</text>
  <text x="180" y="248" fill="#555" text-anchor="middle">chain: best split cuts 1 edge</text>

  <g stroke="#9a9a9a" stroke-width="2">
    <line x1="460" y1="130" x2="500" y2="61"/><line x1="460" y1="130" x2="500" y2="199"/><line x1="500" y1="61" x2="500" y2="199"/>
    <line x1="620" y1="130" x2="580" y2="61"/><line x1="620" y1="130" x2="580" y2="199"/><line x1="580" y1="61" x2="580" y2="199"/>
  </g>
  <g stroke="#d64545" stroke-width="2.2">
    <line x1="460" y1="130" x2="620" y2="130"/><line x1="460" y1="130" x2="580" y2="61"/><line x1="460" y1="130" x2="580" y2="199"/>
    <line x1="500" y1="61" x2="620" y2="130"/><line x1="500" y1="61" x2="580" y2="61"/><line x1="500" y1="61" x2="580" y2="199"/>
    <line x1="500" y1="199" x2="620" y2="130"/><line x1="500" y1="199" x2="580" y2="61"/><line x1="500" y1="199" x2="580" y2="199"/>
  </g>
  <line x1="540" y1="40" x2="540" y2="220" stroke="#666" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g fill="#ffffff" stroke="#444" stroke-width="1.8">
    <circle cx="460" cy="130" r="9"/><circle cx="500" cy="61" r="9"/><circle cx="500" cy="199" r="9"/>
    <circle cx="620" cy="130" r="9"/><circle cx="580" cy="61" r="9"/><circle cx="580" cy="199" r="9"/>
  </g>
  <text x="480" y="30" fill="#777" text-anchor="middle" font-style="italic">agent A</text>
  <text x="600" y="30" fill="#777" text-anchor="middle" font-style="italic">agent B</text>
  <text x="540" y="248" fill="#555" text-anchor="middle">dense: best split cuts 9 edges</text>
</svg>
